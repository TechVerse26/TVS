  <!-- Font Awesome — সব আইকনের জন্য (fa-solid স্টাইল) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="

  <!-- ══════════════════════════════════════
       CSS — সব ফেজের স্টাইল
       ══════════════════════════════════════ -->
  <link rel="stylesheet" href="/style/main.css" />        <!-- Design tokens, layout, navbar, hero -->
  <link rel="stylesheet" href="/style/components.css" />  <!-- Search overlay, Toast -->
  <link rel="stylesheet" href="/style/post.css" />        <!-- Single post page -->
  <link rel="stylesheet" href="/style/phase2.css" />      <!-- Learn, Course, Lesson, Tools, Comments, Notifications, Bookmark -->
  <link rel="stylesheet" href="/style/phase3.css" />      <!-- Admin, Editor, Analytics, Newsletter -->
</head>
<body>

  <!-- ══════════════════════════════════════
       App Shell — এখানে JS সব render করবে
       ══════════════════════════════════════ -->
  <div id="app">

    <!-- Navbar (navbar.js render করবে) -->
    <nav id="navbar" role="navigation" aria-label="প্রধান নেভিগেশন"></nav>

    <!-- Search Overlay (search.js control করবে) -->
    <div id="search-overlay" class="search-overlay" aria-hidden="true" role="dialog" aria-label="সার্চ">
      <div class="search-modal">
        <div class="search-header">
          <span class="search-icon icon icon-muted" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input
            type="text"
            id="search-input"
            placeholder="খুঁজুন... (Ctrl+K)"
            autocomplete="off"
            aria-label="সার্চ ইনপুট"
          />
          <kbd class="search-esc" onclick="window.Search.close()" role="button" tabindex="0">ESC</kbd>
        </div>
        <div id="search-results" class="search-results" role="listbox"></div>
      </div>
    </div>

    <!-- Page Content (router প্রতিটি পেজ এখানে render করবে) -->
    <main id="page-content" role="main" aria-live="polite"></main>

    <!-- Footer (footer.js render করবে) -->
    <footer id="footer" role="contentinfo"></footer>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- ══════════════════════════════════════
       Firebase SDK + App Bootstrap
       type="module" ব্যবহার করা হয়েছে
       কারণ ES Modules দরকার
       ══════════════════════════════════════ -->
  <script type="module">
    // ── Firebase SDK ──────────────────────────────────────────
    import { initializeApp }  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth }        from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore }   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { getAnalytics }   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js';

    // ── তোমার Firebase Config ─────────────────────────────────
    // ⚠️  src/firebase/config.js ফাইলে তোমার নিজের config বসাও
    import { firebaseConfig } from '/src/firebase/config.js';

    // ── Firebase Initialize ───────────────────────────────────
    const app       = initializeApp(firebaseConfig);
    const auth      = getAuth(app);
    const db        = getFirestore(app);
    const analytics = getAnalytics(app);

    // Global access — সব JS ফাইল window.__firebase ব্যবহার করে
    window.__firebase = { app, auth, db, analytics };

    // Auth state এখনো settle হয়নি — undefined রাখো
    // onAuthStateChanged fire হলে app.js এটা set করবে
    window.__user = undefined;

    // ── App Boot ──────────────────────────────────────────────
    // Firebase ready হওয়ার পর App শুরু হবে
    const { App } = await import('/src/app.js');
    App.init();
  </script>

</body>
</html>
